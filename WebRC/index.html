<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeIRC -- IRC Chat</title>
<style>
body {
  background: #4D301B;
  color: black;
  font-family: 'Courier New', monospace;
}
header {
  background: #160F07;
  color: #E0D5C8;
  padding: 10px;
}
#messages {
  height: 70vh;
  overflow-y: auto;
  padding: 10px;
}
#frm {
  display: flex;
  padding: 10px;
  gap: 5px;
}
input {
  background: #A2805D;
  color: black;
  border: 2px solid #655D21;
  padding: 12px;
  flex: 1;
}
button {
  background: #326554;
  color: white;
  border: 1px solid #1E3D33;
  padding: 10px;
  cursor: pointer;
}
#pup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  display: flex;
  justify-content: center;
  align-items: center;
}

#pup-box {
 background: #160F07;
 color: #E0D5C8;
 padding: 20px;
 border: 2px solid #655D21;
 display: flex;
 flex-direction: column;
 gap: 10px;
}
</style>
</head>
<body>

<div id="pup">
  <form id="pup-box">
    <label>Enter Nickname:</label>
    <input id="nick-input" placeholder="Your NickName Sir..." required autocomplete="off">
    <button type="submit">Join</button>
  </form>
</div>

<header>
 <b>WeIRC Chat -- Come Back !</b>
 <span id="status">Offline</span>
</header>

<div id="messages"></div>

<form id="frm">
 <input id="msg-input" placeholder="Write a Msg..." autocomplete="off">
 <button type="submit">Send</button>
</form>

<script>
const server = "ws://192.168.1.102:8080";
const room = "#general";
const originalTitle = document.title;
let unreadMessages = 0;

const chatBox = document.getElementById("messages");
const statusText = document.getElementById("status");
const chatForm = document.getElementById("frm");
const messageInput = document.getElementById("msg-input");
const popup = document.getElementById("pup");
const popupForm = document.getElementById("pup-box");
const nickInput = document.getElementById("nick-input");

let socket;

document.addEventListener("visibilitychange", function() {
    if (!document.hidden) {
        unreadMessages = 0;
        document.title = originalTitle;
    }
});

function addMessage(text) {
    const newMessage = document.createElement("div");
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    let lastIndex = 0;
    let match;

    while ((match = urlRegex.exec(text)) !== null) {
        newMessage.appendChild(
            document.createTextNode(text.slice(lastIndex, match.index))
        );

        const link = document.createElement("a");
        link.href = match[0];
        link.textContent = match[0];
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        newMessage.appendChild(link);
        lastIndex = urlRegex.lastIndex;
    }

    newMessage.appendChild(
        document.createTextNode(text.slice(lastIndex))
    );

    chatBox.appendChild(newMessage);
    chatBox.scrollTop = chatBox.scrollHeight;
}

popupForm.onsubmit = function(event) {
    event.preventDefault();

    const nickname = nickInput.value.trim();

    if (nickname === "") return;

    popup.style.display = "none";
    startChat(nickname);
};

function startChat(nickname) {
    socket = new WebSocket(server);

    socket.onopen = function() {
        statusText.textContent = "Connected";

        socket.send("NICK " + nickname + "\r\n");
        socket.send("USER " + nickname + " 0 * :Guest\r\n");
    };

    socket.onmessage = function(event) {
        const lines = event.data.split("\r\n");

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];

            if (line === "") continue;

            if (line.startsWith("PING")) {
                socket.send("PONG " + line.slice(5) + "\r\n");
                continue;
            }

            if (line.includes(" 001 ")) {
                socket.send("JOIN " + room + "\r\n");
            }

            if (line.includes(" PRIVMSG ") && document.hidden) {
                const sender = line.startsWith(":")
                    ? line.slice(1).split(/[! ]/, 1)[0]
                    : "";

                const ownNick = nickInput.value.trim();

                if (
                    sender &&
                    sender.toLowerCase() !== ownNick.toLowerCase()
                ) {
                    unreadMessages++;
                    document.title =
                        "(" + unreadMessages + ") New Message!";
                }
            }

            addMessage(line);
        }
    };

    socket.onclose = function() {
        statusText.textContent = "Disconnected";
    };

    socket.onerror = function() {
        statusText.textContent = "Connection error";
    };
}

chatForm.onsubmit = function(event) {
    event.preventDefault();

    const text = messageInput.value.trim();

    if (
        text !== "" &&
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {
        socket.send("PRIVMSG " + room + " :" + text + "\r\n");

        addMessage("<" + nickInput.value.trim() + "> " + text);

        messageInput.value = "";
    }
};

// NOTE : i had used AI on some parts of just JavaScript , HTML/CSS is Complete-Human-Made
</script>
</body>
</html>
